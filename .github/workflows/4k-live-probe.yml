name: 4K Ursa Live Probe

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'tools/4k-live-probe.js'
      - '.github/workflows/4k-live-probe.yml'
      - 'src/services/resolver.js'
      - 'src/config.js'
      - 'cloudflare-worker/worker.js'
  workflow_dispatch:
    inputs:
      title:
        description: 'Optional title substring (default: Dune, Fight Club, Arcane)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund

      - name: Run the live 4K tier probe
        env:
          TMDB_API_KEY: ${{ vars.TMDB_API_KEY || '47a1a7df542d3d483227f758a7317dff' }}
          FOURKHDHUB_BASE_URL: ${{ vars.FOURKHDHUB_BASE_URL || 'https://4khdhub.one' }}
          MOVIESDRIVE_BASE_URL: ${{ vars.MOVIESDRIVE_BASE_URL || 'https://new5.moviesdrive.christmas' }}
          HICINE_API_BASE: ${{ vars.HICINE_API_BASE || 'https://api.hicine.sbs' }}
          DAHMER_BASE_URL: ${{ vars.DAHMER_BASE_URL || 'https://a.111477.xyz' }}
        run: |
          args=""
          if [ -n "${{ inputs.title }}" ]; then args="--title=${{ inputs.title }}"; fi
          node tools/4k-live-probe.js --out diagnostics/4k-live-probe.json $args

      - name: Upload diagnostics artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4k-live-probe
          path: diagnostics/4k-live-probe.json
          if-no-files-found: warn
          retention-days: 14

      - name: Persist diagnostics on the branch
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          report_tmp="$(mktemp)"
          cp diagnostics/4k-live-probe.json "$report_tmp"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            # Rebase the report onto the newest branch without letting a
            # concurrent probe workflow delete another workflow's diagnostics.
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp "$report_tmp" diagnostics/4k-live-probe.json
            git add -f diagnostics/4k-live-probe.json
            if git diff --cached --quiet; then
              echo "report already up to date"
              exit 0
            fi
            git commit -q -m "chore(research): live 4K probe report [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push attempt ${attempt} lost the race, retrying..."
            sleep 5
          done
          echo "could not persist the report after retries" >&2
          exit 1
