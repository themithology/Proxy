name: Hindi Dub Live Verify

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'tools/hindi-dub-live-verify.js'
      - '.github/workflows/hindi-dub-live.yml'
      - 'src/services/identity.js'
      - 'src/services/dubCatalog.js'
  workflow_dispatch:
    inputs:
      deep:
        description: 'Also probe the deep providers (MoviesDrive/4KHDHub/HiCine/Dahmer/HiAnime)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund

      - name: Live-verify the TMDB-id keyed Hindi dub layer
        env:
          TMDB_API_KEY: ${{ vars.TMDB_API_KEY || '47a1a7df542d3d483227f758a7317dff' }}
        run: |
          node tools/hindi-dub-live-verify.js \
            --out diagnostics/hindi-dub-live.json \
            ${{ (github.event.inputs.deep == 'true' && '--deep') || '' }}

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: hindi-dub-live
          path: diagnostics/hindi-dub-live.json
          if-no-files-found: warn
          retention-days: 14

      - name: Persist report on the branch
        if: github.ref != 'refs/heads/main'
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" 
          # The report is a generated artifact: each attempt re-parents it onto
          # the current remote tip (ours always wins) and pushes, so concurrent
          # runs cannot deadlock on a rebase conflict.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset --soft "origin/${GITHUB_REF_NAME}"
            git add -f diagnostics/hindi-dub-live.json
            if git diff --cached --quiet; then
              echo "report already up to date"
              exit 0
            fi
            git commit -q -m "chore(research): live hindi dub verification report [skip ci]"
            if git push; then
              exit 0
            fi
            echo "push attempt ${attempt} lost the race, retrying..."
            sleep 5
          done
          echo "could not persist the report after retries" >&2
          exit 1
