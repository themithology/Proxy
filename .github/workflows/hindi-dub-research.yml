name: Hindi Dub Accuracy Research

on:
  # Push trigger is what actually registers/runs this on arena/** branches; the
  # dispatch form is a convenience once GitHub has indexed the workflow.
  push:
    branches:
      - 'arena/**'
    paths:
      - 'tools/hindi-dub-research.js'
      - '.github/workflows/hindi-dub-research.yml'
  workflow_dispatch:
    inputs:
      quick:
        description: 'Only probe Fight Club + Dune'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe live upstreams (CastleTV / Moviebox / TMDB)
        run: |
          node tools/hindi-dub-research.js --out diagnostics/hindi-dub-research.json ${{ github.event.inputs.quick == 'true' && '--quick' || '' }}

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: hindi-dub-research
          path: diagnostics/hindi-dub-research.json
          if-no-files-found: warn
          retention-days: 14

      - name: Persist report on the branch
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f diagnostics/hindi-dub-research.json
          git diff --cached --quiet && echo "no report changes" && exit 0
          git commit -m "chore(research): hindi dub probe report [skip ci]"
          git push
