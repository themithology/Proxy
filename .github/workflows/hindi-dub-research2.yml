name: Hindi Dub Accuracy Research R2

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'tools/hindi-dub-research2.js'
      - '.github/workflows/hindi-dub-research2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe live upstreams (round 2)
        run: node tools/hindi-dub-research2.js --out diagnostics/hindi-dub-research2.json

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: hindi-dub-research2
          path: diagnostics/hindi-dub-research2.json
          if-no-files-found: warn
          retention-days: 14

      - name: Persist report on the branch
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f diagnostics/hindi-dub-research2.json
          git diff --cached --quiet && echo "no report changes" && exit 0
          git commit -m "chore(research): hindi dub probe report r2 [skip ci]"
          git push
