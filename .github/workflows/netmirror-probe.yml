name: NetMirror Probe

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'tools/netmirror-probe.js'
      - '.github/workflows/netmirror-probe.yml'
      - 'src/services/resolver.js'
      - 'src/config.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund

      - name: Probe NetMirror discovery + endpoints + resolver
        run: node tools/netmirror-probe.js --out diagnostics/netmirror-probe.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: netmirror-probe
          path: diagnostics/netmirror-probe.json
          if-no-files-found: warn
          retention-days: 14

      - name: Persist report on the branch
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset --soft "origin/${GITHUB_REF_NAME}"
            git add -f diagnostics/netmirror-probe.json
            if git diff --cached --quiet; then echo "report already up to date"; exit 0; fi
            git commit -q -m "chore(research): netmirror probe report [skip ci]"
            git push && exit 0
            echo "push attempt ${attempt} lost the race, retrying..."
            sleep 5
          done
          exit 1
