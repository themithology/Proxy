name = "lol-embed-backend"
main = "cloudflare-worker/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# The public directory holds the /embed player page, its CSS/JS/vendor assets,
# and the LOL Embed social/meta GIF. No landing page, portal, or admin UI.
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
run_worker_first = true

[vars]
ADMIN_SECRET = "admin123"
TMDB_API_KEY = "47a1a7df542d3d483227f758a7317dff"
PROXY_SECRET = "vidstuck-edge-hmac-secret-key-2026-9f8e7d6c5b4a"
CASTLETV_BASE_URL = "https://api.hlowb.com"
NETMIRROR_BASE_URL = "https://net27.cc"
HICINE_API_BASE = "https://api.hicine.sbs"

# Hamster Wheel (server #3) runs on the Node backend: HMAC signing, HTML
# release-page extraction, HubCloud unrolling and media probes do not fit the
# Worker CPU budget, and some upstream hosts block Cloudflare egress IPs.
# Set this to the Node deployment's absolute URL to let the Worker's waterfall
# delegate Hamster Wheel resolves to it. Leave empty to keep the server listed
# but skipped (the API reports `hamster_backend_not_configured`).
HAMSTER_BACKEND_URL = ""

# Anime Dub Hindi (Centaurus / server #2 second source) also runs on the Node
# backend. Defaults to HAMSTER_BACKEND_URL when empty, so a single Node
# deployment configures both delegated servers.
ANIMEDUBHINDI_BACKEND_URL = ""

# Centaurus (server #2) as a whole. Set this to the Node deployment's absolute
# URL to delegate HiCine + Anime Dub Hindi to it: the Node tier can remux the
# multi-audio MKVs HiCine serves into HLS with one switchable rendition per
# track (ffmpeg), which the Worker cannot. Defaults to ANIMEDUBHINDI_BACKEND_URL
# then HAMSTER_BACKEND_URL when empty; the in-Worker HiCine path stays as the
# fallback when no backend is reachable.
HICINE_BACKEND_URL = ""

# Base URL of the API Worker/backend the /embed player should call.
# Leave empty ("") when this Worker serves both the player and the API
# (same origin). When the API runs on a different Worker or Node deployment,
# set it to that deployment's absolute URL, e.g.:
#   API_BASE_URL = "https://api.lol-embed.example"
# The embed URL also accepts a per-request `?api=<url>` override.
API_BASE_URL = ""

# Preview-safe vars for `npx wrangler preview` (Workers Builds runs this for
# branch builds). Values must be non-production; <REPLACE_ME> is rejected.
# The TMDB values below are the public sample keys committed in this repo.
[previews.vars]
ADMIN_SECRET = "preview-admin-secret-not-production"
TMDB_API_KEY = "47a1a7df542d3d483227f758a7317dff"
PROXY_SECRET = "preview-proxy-secret-not-production"
API_BASE_URL = ""
CASTLETV_BASE_URL = "https://api.hlowb.com"
NETMIRROR_BASE_URL = "https://net27.cc"
HICINE_API_BASE = "https://api.hicine.sbs"
HAMSTER_BACKEND_URL = ""
ANIMEDUBHINDI_BACKEND_URL = ""
HICINE_BACKEND_URL = ""
