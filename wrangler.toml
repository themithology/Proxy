name = "lol-embed-backend"
main = "cloudflare-worker/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# The public directory holds the /embed player page, its CSS/JS/vendor assets,
# the documentation page (/docs), the owner dashboard (/reze) and the LOL Embed
# social/meta GIF. Nothing is served from it unless the Worker routes to it.
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
run_worker_first = true

# Usage statistics and owner settings behind the dashboard (/reze): one
# SQLite-backed Durable Object keeps global counters, blocked sites, and the
# per-site ad-free list. Works on the Workers Free plan; nothing to create by
# hand — `wrangler deploy` applies the migration. Remove both blocks to run
# with in-memory (per-isolate, non-persistent) state instead.
[[durable_objects.bindings]]
name = "STATS"
class_name = "StatsStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StatsStore"]

[vars]
# ---------------------------------------------------------------------------
# ADMIN_SECRET and PROXY_SECRET are deliberately NOT here.
#
# They used to be committed in plaintext ("admin123" and a fixed HMAC key), and
# those exact strings were also the in-code fallbacks — so any deployment that
# forgot to override them was fully controllable by anyone who had read this
# repo: /api/admin/* hot-swaps upstream URLs and AES keys and injects arbitrary
# stream URLs for any TMDB id, and PROXY_SECRET signs every proxy URL.
#
# Set them as Cloudflare *secrets* (encrypted, never in git):
#   npx wrangler secret put PROXY_SECRET
#   npx wrangler secret put ADMIN_SECRET
#
# Generate one with:
#   node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"
#
# PROXY_SECRET MUST be identical on every runtime that signs or verifies proxy
# URLs (this Worker, any Worker in EXTERNAL_PROXY_POOL, and the Node backend),
# otherwise URLs signed by one are rejected by another.
#
# The Worker fails CLOSED without them: /api/proxy answers 503 and /api/admin/*
# answers 503, rather than running unauthenticated. Local `wrangler dev` reads
# .dev.vars (gitignored) so development needs no secrets committed.
# ---------------------------------------------------------------------------
TMDB_API_KEY = "47a1a7df542d3d483227f758a7317dff"
CASTLETV_BASE_URL = "https://api.hlowb.com"
NETMIRROR_BASE_URL = "https://net27.cc"
HICINE_API_BASE = "https://api.hicine.sbs"
# Skip Intro / Recap / Credits providers. TheIntroDB (TMDB-keyed) and IntroDB
# (IMDb-keyed) work without keys; THEINTRODB_API_KEY only raises the quota.
THEINTRODB_URL = "https://api.theintrodb.org/v3"
THEINTRODB_API_KEY = ""
INTRODB_URL = "https://api.introdb.app"
ANISKIP_URL = "https://api.aniskip.com/v2"
# Subtitles. OpenSubtitles via Stremio's v3 addon needs no key; Wyzie
# (store.wyzie.io/redeem) and SubDL (subdl.com account) are optional extras.
OPENSUBTITLES_STREMIO_URL = "https://opensubtitles-v3.strem.io"
WYZIE_API_KEY = ""
SUBDL_API_KEY = ""
# Extra hosts the subtitle proxy may fetch from (comma-separated).
SUBTITLE_PROXY_HOSTS = ""

# Ads on the /embed player page (the popunder tag in public/embed.html).
# "true" (default) serves it; "false" strips it for an ad-free player.
ADS_ENABLED = "true"

# Base URL of the API Worker/backend the /embed player should call.
# Leave empty ("") when this Worker serves both the player and the API
# (same origin). When the API runs on a different Worker or Node deployment,
# set it to that deployment's absolute URL, e.g.:
#   API_BASE_URL = "https://api.lol-embed.example"
# The embed URL also accepts a per-request `?api=<url>` override.
API_BASE_URL = ""

# Preview vars for `npx wrangler preview` (Workers Builds runs this for branch
# builds). Values must be non-production; <REPLACE_ME> is rejected.
#
# ADMIN_SECRET / PROXY_SECRET are intentionally ABSENT here too. A preview URL is
# publicly reachable, so committing a known preview secret would recreate exactly
# the forgeable-signature / open-relay hole on the preview deployment. Previews
# therefore fail closed: /api/proxy and /api/admin/* return 503 with a hint, while
# the player page, docs and dashboard shell still render. To exercise playback in
# a remote preview, set the secrets for that environment explicitly instead of
# committing them.
[previews.vars]
TMDB_API_KEY = "47a1a7df542d3d483227f758a7317dff"
API_BASE_URL = ""
ADS_ENABLED = "false"
CASTLETV_BASE_URL = "https://api.hlowb.com"
NETMIRROR_BASE_URL = "https://net27.cc"
HICINE_API_BASE = "https://api.hicine.sbs"
