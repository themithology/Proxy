name = "lol-embed-backend"
main = "cloudflare-worker/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# The public directory holds the /embed player page, its CSS/JS/vendor assets,
# and the LOL Embed social/meta GIF. No landing page, portal, or admin UI.
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
run_worker_first = true

[vars]
ADMIN_SECRET = "admin123"
TMDB_API_KEY = "47a1a7df542d3d483227f758a7317dff"
PROXY_SECRET = "vidstuck-edge-hmac-secret-key-2026-9f8e7d6c5b4a"
CASTLETV_BASE_URL = "https://api.hlowb.com"
NETMIRROR_BASE_URL = "https://net27.cc"
HICINE_API_BASE = "https://api.hicine.sbs"
# Skip Intro / Recap / Credits providers. TheIntroDB (TMDB-keyed) and IntroDB
# (IMDb-keyed) work without keys; THEINTRODB_API_KEY only raises the quota.
THEINTRODB_URL = "https://api.theintrodb.org/v3"
THEINTRODB_API_KEY = ""
INTRODB_URL = "https://api.introdb.app"
ANISKIP_URL = "https://api.aniskip.com/v2"

# Base URL of the API Worker/backend the /embed player should call.
# Leave empty ("") when this Worker serves both the player and the API
# (same origin). When the API runs on a different Worker or Node deployment,
# set it to that deployment's absolute URL, e.g.:
#   API_BASE_URL = "https://api.lol-embed.example"
# The embed URL also accepts a per-request `?api=<url>` override.
API_BASE_URL = ""

# Preview-safe vars for `npx wrangler preview` (Workers Builds runs this for
# branch builds). Values must be non-production; <REPLACE_ME> is rejected.
# The TMDB values below are the public sample keys committed in this repo.
[previews.vars]
ADMIN_SECRET = "preview-admin-secret-not-production"
TMDB_API_KEY = "47a1a7df542d3d483227f758a7317dff"
PROXY_SECRET = "preview-proxy-secret-not-production"
API_BASE_URL = ""
CASTLETV_BASE_URL = "https://api.hlowb.com"
NETMIRROR_BASE_URL = "https://net27.cc"
HICINE_API_BASE = "https://api.hicine.sbs"
